name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "在 main/master 手動執行時同步部署 Supabase"
        required: false
        type: boolean
        default: true

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run project guardrails
        run: npm run guardrails

      - name: Lint Edge Function
        run: npm run lint

      - name: Type Check Edge Function
        run: npm run check

  deploy_backend:
    name: Deploy Supabase
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify deploy secrets
        id: deploy_secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Missing SUPABASE_ACCESS_TOKEN secret; skipping Supabase deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Missing SUPABASE_DB_PASSWORD secret; skipping Supabase deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Report skipped Supabase deployment
        if: steps.deploy_secrets.outputs.ready != 'true'
        run: |
          echo "::notice::Supabase deployment was skipped because required deploy secrets are missing."
          {
            echo "## Supabase deployment skipped"
            echo ""
            echo "Backend deployment did not run because one or more required secrets are missing:"
            echo ""
            echo "- SUPABASE_ACCESS_TOKEN"
            echo "- SUPABASE_DB_PASSWORD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Supabase CLI
        if: steps.deploy_secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        if: steps.deploy_secrets.outputs.ready == 'true'
        run: bash scripts/supabase_db_push.sh

      - name: Deploy Edge Function
        if: steps.deploy_secrets.outputs.ready == 'true'
        run: bash scripts/supabase_deploy.sh
